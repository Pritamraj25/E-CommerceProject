
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Product | Product Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3eeff, #f5e9ff);
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .navbar {
            background: #272b6b;
            padding: 15px 35px;
        }

        .navbar-brand {
            color: white;
            font-size: 21px;
            font-weight: 700;
        }

        .navbar-brand:hover {
            color: #ddd;
        }

        .view-btn {
            background: white;
            color: #5148d8;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .view-btn:hover {
            background: #e9e7ff;
            color: #3930a5;
        }

        .main-container {
            max-width: 750px;
            margin: 45px auto;
            padding: 0 15px;
        }

        .form-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .form-icon {
            width: 65px;
            height: 65px;
            background: #eeecff;
            color: #6558e8;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin: 0 auto 15px;
        }

        .form-title {
            text-align: center;
            color: #292d5e;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #444;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background-color: #fafafa;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6558e8;
            box-shadow: 0 0 0 0.2rem rgba(101,88,232,0.12);
            background: white;
        }

        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }

        .save-btn {
            background: #6558e8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .save-btn:hover {
            background: #4c40c5;
            color: white;
        }

        .reset-btn {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .success {
            border-radius: 8px;
            font-size: 14px;
        }

        @media(max-width: 576px) {
            .navbar {
                padding: 14px;
            }

            .form-card {
                padding: 24px 18px;
            }

            .main-container {
                margin: 25px auto;
            }
        }
    </style>

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a class="navbar-brand" th:href="@{/products}">
                <i class="bi bi-box-seam me-2"></i>
                Product Management
            </a>

            <a th:href="@{/products}" class="view-btn">
                <i class="bi bi-eye me-2"></i>
                View All Products
            </a>

        </div>

    </nav>


    <!-- Main Form Container -->
    <div class="main-container">

        <div class="form-card">

            <!-- Heading -->
            <div class="form-icon">
                <i class="bi bi-plus-square"></i>
            </div>

            <h2 class="form-title">Update Product</h2>

            <p class="subtitle">
                Enter the product details below to Update product.
            </p>


            <!-- Success Message -->
            <div class="alert alert-success success"
                 th:if="${msg != null}">

                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${msg}"></span>

            </div>


            <!-- Product Form -->
            <form th:action="@{/save}"
                  th:object="${product}"
                  method="post">
<input type="hidden" th:field="*{id}">
                <div class="row g-3">

                    <!-- Product Name -->
                    <div class="col-md-12">

                        <label class="form-label">
                            <i class="bi bi-box me-1"></i>
                            Product Name
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter Product Name"
                               th:field="*{name}">

                        <p class="error"
                           th:if="${#fields.hasErrors('name')}"
                           th:errors="*{name}">
                        </p>

                    </div>


                    <!-- Product Price -->
                    <div class="col-md-6">

                        <label class="form-label">
                            <i class="bi bi-currency-rupee me-1"></i>
                            Product Price
                        </label>

                        <input type="number"
                              
                               class="form-control"
                               placeholder="Enter Product Price"
                               th:field="*{price}">

                        <p class="error"
                           th:if="${#fields.hasErrors('price')}"
                           th:errors="*{price}">
                        </p>

                    </div>


                    <!-- Product Quantity -->
                    <div class="col-md-6">

                        <label class="form-label">
                            <i class="bi bi-stack me-1"></i>
                            Product Quantity
                        </label>

                        <input type="number"
                              
                               class="form-control"
                               placeholder="Enter Product Quantity"
                               th:field="*{qty}">

                        <p class="error"
                           th:if="${#fields.hasErrors('qty')}"
                           th:errors="*{qty}">
                        </p>

                    </div>


                    <!-- Product Category -->
                    <div class="col-md-12">

                        <label class="form-label">
                            <i class="bi bi-grid me-1"></i>
                            Product Category
                        </label>

                        <select class="form-select"
                                th:field="*{category}">

                            <option value="">Select Category</option>

                            <option value="Electronics">
                                Electronics
                            </option>

                            <option value="Clothes">
                                Clothes
                            </option>

                            <option value="Grocery">
                                Grocery
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                        <p class="error"
                           th:if="${#fields.hasErrors('category')}"
                           th:errors="*{category}">
                        </p>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="row g-3 mt-4">

                    <div class="col-md-8">

                        <button type="submit"
                                class="btn save-btn w-100">

                            <i class="bi bi-check-circle me-2"></i>
                            Update Product

                        </button>

                    </div>

                    <div class="col-md-4">

                        

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
